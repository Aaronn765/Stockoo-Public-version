name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockoo_demo
          POSTGRES_USER: demo
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U demo -d stockoo_demo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      STOCKOO_TEST_DATABASE_URL: postgres://demo@127.0.0.1:55433/stockoo_demo

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres
